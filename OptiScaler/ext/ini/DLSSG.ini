; -------------------------------------------------------
; Optional built-in RTX 40 (Ada) multi frame generation unlock with targeted temporal correction.
; Memory-only, supported nvngx_dlssg.dll runtimes only, nvngx_dlssg.dll on disk is never modified.
; Never combine with an external unlocker. Save Settings and restart after changing.
; Verified on an RTX 4090 at 2x to 4x. 5x and 6x are experimental; one GPU hang was seen at 6x.
; RTX 20/30/50 stay unpatched.
; true or false - Default (auto) is false
AdaMfgUnlock=auto

; -------------------------------------------------------
; RTX 20/30 (Turing/Ampere) multi frame generation through a companion DLSS-G runtime (experimental).
; Put the companion DLL in OptiScaler/dlssg_sm86. OptiFG stays the frame producer.
; Do not enable the built-in Ada unlock together with it. Save Settings and restart after changing.
; true or false - Default (auto) is false
AmpereMfgUnlock=auto

; Largest number of generated frames the companion is configured for (1 = 2X ... 5 = 6X)
; int - Default (auto) is 3
AmpereMfgMaxFrames=auto

; Interpolation kernel image: Auto, PTX or Cubin
; string - Default (auto) is Auto
AmpereMfgKernelImage=auto

; Router written to the companion ini (Auto picks one for the detected GPU)
; string - Default (auto) is Auto
AmpereMfgRouter=auto

; Hardware bilinear sampling in the companion kernels
; true or false - Default (auto) is false
AmpereMfgHardwareBilinear=auto

; Companion optimisation level written to its ini
; int - Default (auto) is 1
AmpereMfgOptimized=auto

; Companion preset written to its ini
; string - Default (auto) is Auto
AmpereMfgPreset=auto

; Architecture the companion reports to the game
; string - Default (auto) is Auto
AmpereMfgSpoofArchToGame=auto

; Companion log level 0..3
; int - Default (auto) is 1
AmpereMfgLogLevel=auto

; -------------------------------------------------------
; Separate UI path for DLSS-G (DLSSGOptions::enableUserInterfaceRecomposition). Only used while a hud-less image source is
; delivering frames; read when the DLSS-G feature is created, so change it before the game starts.
; true or false - Default (auto) is on while a hud-less source is in use
UIRecomposition=auto

; -------------------------------------------------------
; Automatic multi frame generation multiplier for DLSS-G on RTX 40 (experimental, untested in game).
; Picks 2x-4x from the real frame time and changes the count in place, without the off/on cycle of the Frame Gen slider.
; Needs the built-in Ada MFG unlock (AdaMfgUnlock) for anything above 2x. Never goes above 4x. Inert on RTX 50 (use Force
; Dynamic MFG there), with Frame Gen on Default, with Force Dynamic MFG and with other frame generation outputs.
; A change can still cost one long frame (about 0.2 s) if Streamline re-creates the feature; the mode then slows down
; (12 s between changes) and stops after two such changes in a row, or three in all. An earlier one is forgotten only
; after ten clean changes in a row, counted in changes and not in time (with few changes that can take hours). Save
; Settings does not store the automatic choice.
; A game stall (a loading screen, a menu change that re-creates DLSS) is never held against the mode: while the real frame
; rate is below about 33 fps (an average above 30 ms) no change is made and the last one is not judged; it is judged after one
; calm second, or skipped without a strike (log: "judging the change at Nx skipped, the game was stalled") when that is not
; possible within 5 seconds. On a setup that always runs below about 33 real fps the mode therefore never changes the count.
; Force Dynamic MFG on an unlocked RTX 40 never presents more than 4x, but a frame limit still paces for the Frame Gen slider:
; with a frame limit keep the slider on 4X.
; true or false - Default (auto) is false
AutoMFG=auto

; Highest multiplier the automatic mode may use: 2 (2x) to 4 (4x)
; int - Default (auto) is 4
AutoMFGMax=auto

; Frame rate the automatic mode aims for. 0 (auto) is the lower of the frame rate limit and the display refresh rate.
; float - Default (auto) is 0
AutoMFGTarget=auto

; One-off check for the maintainer: changes the count 2x, 3x, 4x, 3x, 2x, six seconds apart, and logs one line that starts
; with "AutoMFG self-test: PASS" or "AutoMFG self-test: FAIL". Needs AutoMFG=true, Frame Gen on a fixed multiplier (3X or
; 4X so that all five changes happen) and the INFO log level. Starts after 20 seconds without a stall (a stall during it ends it
; as "interrupted") and then takes about 40 seconds in the game world.
; true or false - Default (auto) is false
AutoMFGSelfTest=auto
