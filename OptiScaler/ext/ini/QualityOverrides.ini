; -------------------------------------------------------
; Which quality preset the game is answered with, whichever one it asks for.
;
; The preset is normally the game's choice, and the ratios below are indexed by it -- so in a game
; that never exposes a selector (Final Fantasy XIV offers only DLSS or FSR and picks for itself)
; your setting lands in a slot the game never asks for. This replaces the answer at the point the
; question is asked, so the game allocates its buffers to your choice instead.
;
; This changes the preset used for the optimal-settings answer. DRS remains available unless its
; normal override controls below are enabled.
;
;  -1  leave the game's choice alone
;   0  Max Performance    2.0
;   1  Balanced           1.7
;   2  Max Quality        1.5
;   3  Ultra Performance  3.0
;   4  Ultra Quality      1.3
;   5  DLAA / native      1.0
;
; Default (auto) is -1
ForcePerfQuality=auto
