; -------------------------------------------------------
; Menu style. classic is OptiScaler's own look: the accent colour tints every surface, button, header and the title bar, so a
; bright accent such as orange turns into brown buttons and a rust title bar. ember keeps all of those neutral (charcoal
; surfaces, 1px hairlines, rounder corners, more room) and uses the accent colour only to mark state: the check mark, the
; slider grab, the selected tab's overline, the focus ring, the text selection and the plots. It uses AccentColorR/G/B and
; BGColorA (the window's opacity; BGColorR/G/B is not used). It is a dark style: with LightTheme on, the menu stays classic.
; Ini only. No menu control: it applies the next time the menu opens, and when you change a theme colour in the menu.
; classic or ember - Default (auto) is classic
Style=auto
