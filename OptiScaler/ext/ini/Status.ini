; -------------------------------------------------------
; Generic status file. With this on, the DLL writes status.json next to itself (the game folder, beside the log file):
; a small versioned snapshot for bug reports and tools (format, versions, feature states, frame-time percentiles, the
; last writer error). The schema is documented in docs/notes/status-json.md. The file never holds a path, a drive
; letter, a user name or a character name: runtimes are named by folder label only (a closed set: "game folder",
; "OptiScaler folder", "streamline folder", "NGX driver folder", "other folder").
; The write is atomic (a temporary file renamed over the old one), at most 16 KB, throttled (first write about 2 s
; after the first present, then on a state change at most once a second, plus a heartbeat every 10 s) and made by a
; below-normal-priority worker thread that starts on the first present: nothing here runs on the render-critical path
; and the game never waits for it. With two game clients only the first one to present owns the file. Ini only.
; No menu control: it is a diagnostic switch for bug reports.
; true or false - Default (auto) is false
Enabled=auto
