; -------------------------------------------------------
; InterpolationCount (above) accepts 1..7 (1 = 2X ... 7 = 8X); values outside that range are ignored.
; It only takes effect when UnlockMFG is enabled, and is capped by what the provider reports as supported.

; Automatic 2X-4X factor selection from the real frame timing. The slider/InterpolationCount still picks Off/Default.
; The target is bounded by FramerateLimit.
; true or false - Default (auto) is false
DynamicMFG=auto

; Target FPS for DynamicMFG, 30 - 500
; float - Default (auto) is 138
DynamicTargetFPS=auto

; Unlocks multi frame generation in Intel's libxess_fg.dll
; Intel gates MFG behind an "am I the igxess_fg.dll build?" check rather than a real hardware query, so on other
; adapters the provider reports a maximum of 1 interpolated frame and the MFG combo box never appears.
; This applies byte patches to the already loaded provider image at runtime; the dll on disk is never modified.
; If the provider build is not recognised every patch is skipped and the provider behaves as it always did.
; true or false - Default (auto) is true
UnlockMFG=auto

; Interpolated frames reported as the maximum once UnlockMFG is on
; N = number of frames generated between two rendered frames, so the multiplier shown in the menu is N+1:
; 1 = 2X ... 7 = 8X
; NOTE this is not only a menu bound: the same number is handed to the provider as the swapchain's
; maxInterpolatedFrames at init, so it is declared on every launch. If a higher multiplier turns out to be unstable,
; try 3 (4X) first. Values outside 1..7 are ignored.
; int 1..7 - Default (auto) is 7
MaxInterpolatedFrames=auto

; Spreads every generated frame above 2X out in time instead of presenting the burst back to back.
; Takes effect once, at XeFG init: needs a game restart.
; true or false - Default (auto) is true
ExtraPacing=auto

; Rebuild the XeFG context when the upscaler is released (quality or NR change) so the provider's pacing history starts
; clean. Only used by games that isolate NGX shutdown (FFXIV).
; true or false - Default (auto) is true
ResetOnUpscalerChange=auto
