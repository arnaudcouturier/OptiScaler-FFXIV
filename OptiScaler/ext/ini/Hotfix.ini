; Take the render size from the Width/Height parameters rather than the render subrect.
;
; NGX means DLSS_Render_Subrect_Dimensions to be the region of the colour buffer holding
; this frame. A game that renders its 3D scene smaller than its UI may allocate that
; buffer at display size and report the allocation here instead, with the frame's real
; size in Width/Height. Reading the subrect then makes the render size look equal to the
; display size: no DLSS-NR dual-feature split, and an evaluate the runtime refuses
; because the feature was created at the smaller size.
;
; FFXIV only: the code that reads this key exists only for the matched FFXIV build, so
; it does nothing in any other game. Leave this off unless the render size looks wrong in
; FFXIV. A wrong reading is a wrong picture rather than an error, and it applies to every
; upscaler in the process.
; true or false - Default (auto) is false
RenderSizeFromWidthHeight=auto

; About CheckForUpdate, upstream's key listed above: auto means false in this fork, whatever
; the "Default (auto) is true" line of that key says. This fork does not check for new
; releases unless you set CheckForUpdate=true. The check then asks upstream OptiScaler's
; GitHub project, not this fork's, so its answer says nothing about this fork. The releases of
; this fork are on its own GitHub page. Save Settings in the menu keeps a true you set.
