; -------------------------------------------------------
; Frame pacing trace. Every 10 seconds, for each thread and each place listed below, one line says how many calls there were, the mean
; and the longest CPU time and how many calls took 8, 16 and 33 ms or more:
;   Frame pacing CPU [<name>] tid <thread>: calls N, mean x ms, max x ms, >=8ms a, >=16ms b, >=33ms c
; The names: native present (the whole DX11 bridge Present), hidden DX11 present, FG dispatch, Reflex sleep, output present (overlay and
; the present of the visible swapchain), scene NR recording, preview NR. CPU time only: queued GPU work is not counted, so the lines show
; where the render and present threads wait. A thread that makes fewer than one call in 10 seconds does not report.
; When the trace starts, one line says why it is on or off: "Frame pacing trace: on (key true)", "on (Debug log)", "off (key unset, log
; level 2)", "off (key false)" or "off (not FFXIV)". The trace only runs in FFXIV.
; auto = on only with file logging at Debug or Trace (the lines of those levels slow the very calls measured, so prefer true),
; true = on at any log level, false = off. Add Trace=true for a measurement run. No menu control: it is a diagnostic switch.
; true, false or auto - Default (auto) is off at the normal log level
Trace=auto

; The hidden DX11 present. The DX11 bridge makes one extra present on a hidden swapchain every frame. With this on, that present carries
; DXGI_PRESENT_DO_NOT_WAIT: if the hidden chain is still busy, DXGI answers at once and that present is skipped instead of blocking the
; thread that drives the visible output. The trace line "Frame pacing CPU [hidden DX11 present] ... skipped k" counts the skips, and one
; line is logged when 120 presents in a row were skipped. If DXGI rejects the flag, it is switched off for the session and logged once.
; Off gives exactly the old call. No menu control: it is a debug switch to compare with the trace.
; true or false - Default (auto) is false
HiddenPresentDoNotWait=auto

; The GPU stage timers. With this on, sampled frames (4 of 16) time the present copy-in (D3D11), the ReShade
; effects (D3D11; the fork's own render_effects calls are left out by their call guards) and the D3D12 interop copy.
; Every 10 seconds each timed stage logs one line:
;   Frame pacing GPU [<stage>]: samples N, mean x ms, p95 y ms, max z ms
; The interop line adds ", cpu offset <s> ms": its samples placed on the CPU clock, measured against the CPU read
; taken when each copy was submitted (a negative value means the GPU began before that read). The pairing of the GPU
; and CPU counters comes from ID3D12CommandQueue::GetClockCalibration and is resampled once per line above, so the
; number costs nothing per frame. D3D11 offers no such pairing call, so the two D3D11 stages log no offset.
; The menu "Per shader GPU times" also gains a corrected "Bridge excl. NR" row (upstream "Interop" minus NR own
; time, latest values read at the same present, 0 or more): a menu row only, with no log line, shown only while
; frame generation runs.
; A timer never waits on the frame path and never calls GetData with a flush (D3D11 pairs are read only at Present
; with DONOTFLUSH; a D3D12 slot reports once the copy fence has passed its resolve). Submission order never changes.
; Durations stay within one API. A creation failure turns that timer off with one warning. Named ranges (D3D11
; annotations, D3D12 list markers) ride the same switch, so captures stay clean unless the timers sample.
; true = on at any log level, false = off, auto = on only together with the trace above (off unless Trace is on).
; Add GpuTimers=true for a measurement run with Trace=true. No menu control: it is a diagnostic switch.
; true, false or auto - Default (auto) is off unless the trace is on
GpuTimers=auto

; The FG event recorder. With this on, the DLL writes one JSONL file per session next to itself, in
; fg-recordings\: every real present (FG chain and visible output, with HRESULT), Reflex sleeps, the hidden
; present, AutoMFG lines, NR model rebuilds, provider activations and module loads. No record holds a path:
; modules are named by file name only. The queue is bounded (overflow is a records_dropped record), each file
; rotates at 16 MiB keeping 9 files per session: 144 MiB plus the one queue batch that crossed each limit, about
; 40 minutes at 60 base fps and 2x frame generation, so a 25-minute session keeps its beginning. Only the newest 5
; sessions are kept. A writer thread below normal priority
; does the disk I/O; with this off there is no thread, no allocation and no file.
; Read a session with tools/analyze-fg-recording.ps1 (exit 0 = clean).
; true or false - Default (auto) is false
FgRecorder=auto

; The one-key mark of the recording. Unbound by default; set it from the Keybinds section of the overlay rather than
; by hand. Each press writes a mark record for that moment into the session file (the analyzer lists them under
; "marks") and one line into OptiScaler.log, "user mark N", so you can say "now" while playing. It fires when you
; release the key. With the recorder off, only the log line is written.
; Default (auto) is unbound
FgRecorderMarkKey=auto

; The simulation tick probe, a measurement. With this on, the game's own tick function is leased once (one pointer swap in the game's vtable
; slot) and every tick, bridge present and Reflex sleep is timestamped on the thread that ran it. Every 10 seconds one line summarises the window:
;   Tick probe: ticks N presents M period p50 a p95 b body p50 c | age p5 d p50 e p95 f | W p50 g p95 h | queue p50 i p95 j | slack p50 k |
;   sleep->tick p50 l | sleep p50 m p95 n (DLSS-G) | threads tick=0x.. bridge=0x.. same | paired P% | counter ok
; All times are milliseconds of CPU time. FFXIV runs its tick and its present on one thread ("same"): then W is the time the game thread spends
; inside the native present and queue reads n/a; on a loop where the present runs outside the tick ("split"), queue is the time a finished tick
; waited for the previous present. paired is the share of presents that found the tick their frame number named. If the slot does not hold the
; tick this build expects, nothing is written and one line says why. Off by default: with it off nothing is installed, no pointer is read and no
; line is written. FFXIV only. No menu control: it is a measurement switch.
; true or false - Default (auto) is false
TickProbe=auto
