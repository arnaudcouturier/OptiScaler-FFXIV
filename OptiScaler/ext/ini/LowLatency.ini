; -------------------------------------------------------
; Low latency selection saved by the menu. Same meaning as [fakenvapi] LowLatencyInput/LowLatencyOutput, which are read
; first; values outside the ranges below are ignored.
;
; Input: 0 - None, 1 - Auto, 2 - AntiLag 2, 3 - Reflex, 4 - XeLL, 5 - UE low latency, 6 - OptiScaler's own Streamline
; Default (auto) is the automatic selection
Input=auto

; Output: 0 - None, 1 - Auto, 2 - LatencyFlex, 3 - AntiLag 2, 4 - XeLL, 5 - AntiLag (Vulkan), 6 - Reflex (Nvidia)
; Default (auto) is the best one for your current setup
Output=auto
