; -------------------------------------------------------
; Window mode. Only for the borderless "fullscreen" that [XeFG] ForceBorderless = true gives (FFXIV with DLSS-G).
; The zero-effort fix needs no key: choose "Borderless Window" in the game's own display settings and restart the game after
; changing the mode. Do not switch to "Fullscreen" while the game runs.
;
;   off   = nothing runs and nothing is logged (today's behaviour)
;   probe = logs one line starting with "Window:" at every resize of the game's swapchain and at every window-mode call that
;           ReShade sees (window styles, rectangles, frame generation state, thread ids). Changes nothing.
;   on    = probe. (The corrections that "on" will add come in later commits of this branch.)
; Applies after a game restart. Any other value counts as off.
; off, probe or on - Default (auto) is off
Mode=auto
