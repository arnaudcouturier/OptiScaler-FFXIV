; -------------------------------------------------------
; Window mode. Only for the borderless "fullscreen" that [XeFG] ForceBorderless = true gives (FFXIV with DLSS-G).
; The zero-effort fix needs no key: choose "Borderless Window" in the game's own display settings and restart the game after
; changing the mode. Do not switch to "Fullscreen" while the game runs.
;
;   off   = nothing runs and nothing is logged (today's behaviour)
;   probe = logs one line starting with "Window:" at every resize of the game's swapchain and at every window-mode call that
;           ReShade sees (window styles, rectangles, frame generation state, thread ids). Changes nothing.
;   on    = probe, plus the border fix: after the game leaves the fork's borderless "fullscreen", a stray window edge that a
;           frame-less window must not have is removed, once DLSS-G frame generation is confirmed off (the correction changes
;           the window's client size, so it must not run while DLSS-G is on). A real windowed mode is left alone.
;           And the mode switch: a window-mode call the game makes while DLSS-G frame generation is running is held back (ReShade
;           reports it before it happens), frame generation is switched off first, and the call is replayed once DLSS-G is
;           confirmed off, so Streamline never sees a window change with DLSS-G on. Needs ReShade; without it the call goes through
;           as before.
; Applies after a game restart. Any other value counts as off.
; off, probe or on - Default (auto) is off
Mode=auto
