; -------------------------------------------------------
; FFXIV nameplates and icons at the real frame rate, with the FFXIV Companion plugin for Dalamud (card "FFXIV Companion
; (nameplates)" of the FFXIV tab). Only for the FFXIV build match.
;
; Draw the nameplates and icons from the game's own native data in the generated frames instead of interpolating them.
; Requires OptiFG DLSS-G or XeFG as the frame generation output and the Companion plugin 0.1.3 or newer reporting stable
; gameplay; until then (and whenever either is missing) the native nameplates stay active. Turning it off restores the
; native nameplates at once.
; true or false - Default (auto) is false
HudReplacement=auto

; Adds one intermediate nameplate position between two observed positions (2x). Requires HudReplacement (so OptiFG DLSS-G or
; XeFG) and the Companion plugin 0.1.2 or newer. Does not interpolate the rest of the HUD; may add one overlay refresh of
; delay. Applies at once.
; true or false - Default (auto) is false
HudInterpolation=auto
