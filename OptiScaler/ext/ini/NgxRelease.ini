; -------------------------------------------------------
; Changing the quality preset in the game releases the DX11 upscaler and builds a new one. Upstream waits 500 ms
; between the two, a fixed pause that shows up as a hitch.
;
; With this on, that pause is skipped when the release has proven that nothing is still using the old upscaler: the
; GPU queues it ran on are idle and no frame is being evaluated with it. If anything is unknown or fails, the pause stays.
; The log line "FFXIV upscaler release: result=..." says what was proven (drained, not-applicable or failed), how long
; the wait took and whether the pause was skipped. Ini only. No menu control: it is a safety switch for the release path.
;
; Off gives exactly the old behaviour: the 500 ms pause, and the release does not wait for frames in flight.
; true or false - Default (auto) is true
SkipReleaseSleep=auto
