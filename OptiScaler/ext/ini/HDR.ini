; -------------------------------------------------------
; OptiHDR (FFXIV): HDR10 output for the D3D11 game through OptiScaler's DX12 presenter. Needs Windows HDR enabled on the
; game display before launch, and DLSS-G, XeFG or frame generation off. Restart after changing FfxivHDR.
; true or false - Default (auto) is false
FfxivHDR=auto

; 0 = SDR expansion (the game's SDR image is expanded to HDR10), 1 = RenoDX scene HDR (the game's tonemap stages are
; replayed in FP16 next to the SDR chain; the SDR chain, ReShade and the HUD are untouched)
; 0 or 1 - Default (auto) is 0
Mode=auto

; Mode 1: preserve measured scene highlights through ReShade's grading (experimental)
; true or false - Default (auto) is false
ReShadeHighlights=auto

; Mode 1: run NR on the linear HDR scene instead of the SDR colour (experimental). Needs NR before upscaling or PreSR.
; true or false - Default (auto) is false
NRSceneInput=auto

; Feed native scene HDR through DLSS w/Dx12 before SDR ReShade processing.
; Experimental; enable RenoDX scene HDR and restart after changing this setting.
; true or false - Default (auto) is false
DLSSSceneInput=auto

; Peak and paper-white brightness of the HDR output, in nits
; float 400 - 4000 - Default (auto) is 1100
PeakNits=auto
; float 80 - 400 (never above PeakNits) - Default (auto) is 203
PaperWhiteNits=auto

; Mode 0: how far above paper white the SDR highlights are expanded (0 = none, 1 = up to PeakNits)
; float 0 - 1 - Default (auto) is 0.5
HighlightExpansion=auto

; Output grading applied before PQ encoding
; Contrast: float 0.5 - 1.5 - Default (auto) is 1.0
Contrast=auto
; Saturation: float 0 - 2 - Default (auto) is 1.0
Saturation=auto
; Vibrance: float -1 - 1 - Default (auto) is 0.0
Vibrance=auto

; -------------------------------------------------------
; OptiScaler menu colours are automatically mapped to HDR when OptiHDR is active.
; Optional screenshot key (Windows virtual-key code). -1 leaves it unbound.
ScreenshotKey=-1
; Save one PNG: 0 = SDR for sharing (default), 1 = HDR. Requires OptiHDR active.
ScreenshotFormat=0
; HDR PNG only: while the OptiScaler menu is open, capture the presented image after the menu was drawn onto it,
; including its HDR colours (useful for settings comparisons). With the menu hidden the normal clean capture is used.
; Needs the overlay menu; SDR PNG captures are unchanged. Default false.
ScreenshotMenu=false
; Use BT.2100 PQ ICC metadata without an outer PNG cICP chunk for HDR sharing.
; HDR pixel values are preserved. Viewer compatibility varies. Default false.
ScreenshotIccOnly=false

; Trace log lines for character preview work (neural rendering on previews). Only logs, changes nothing.
; true or false - Default (auto) is false
PreviewNRTrace=auto
