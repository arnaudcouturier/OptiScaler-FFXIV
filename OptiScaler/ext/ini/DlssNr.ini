; DLSS 5 Neural Rendering (NR). Synthesises detail in the upscaler's output, before frame generation sees it.
;
; Needs nvngx_dlssnr.dll 310.8 placed beside OptiScaler or the game executable, plus
; nvngx.dll_dlssnr.dll from this package. RTX 50 uses the original NVIDIA runtime. RTX 20/30/40 needs
; ShortFuse's cross-generation compatibility runtime from the pinned RenoDX thread; see the
; Install section of the repository README for its SHA-256. The snippet refuses callers whose module path does not contain
; "nvngx.dll", which is the only reason that second file exists.
;
; Undocumented and driven directly, so none of it is officially supported.
; true or false - Default (auto) is false
Enabled=auto

; Virtual-key code for a key that toggles the pass in game. Unbound by default; set it from the
; Keybinds section of the overlay rather than by hand.
; Default (auto) is unbound
ToggleKey=auto

; Virtual-key code for a key that raises the model's working size by 5% per press in game (25% to 200%).
; Only the uniform WorkingScale moves; per-axis keys keep overriding it. Unbound by default; set it from
; the Keybinds section of the overlay rather than by hand.
; Default (auto) is unbound
ScaleUpKey=auto

; Virtual-key code for a key that lowers the model's working size by 5% per press in game (25% to 200%).
; Only the uniform WorkingScale moves; per-axis keys keep overriding it. Unbound by default; set it from
; the Keybinds section of the overlay rather than by hand.
; Default (auto) is unbound
ScaleDownKey=auto

; Virtual-key code for a key that flips the enlargement mode (Classic/Matched residual) in game.
; Does nothing while the Enlargement combo is greyed out. Unbound by default; set it from the
; Keybinds section of the overlay rather than by hand.
; Default (auto) is unbound
TransferToggleKey=auto

; Experimental: pause NR while the game window is not the foreground window or is minimised, so the GPU
; does much less work in the background. The plain upscaler output is shown meanwhile and NR resumes with a
; clean history when the window is focused again. Pauses after 1 s without focus (at once when minimised) and
; resumes after 0.25 s of focus, so a brief popup does not flap it. Does not change Enabled. Covers the D3D12
; and D3D11-bridge paths and the character preview NR; native Vulkan is not paused.
; true or false - Default (auto) is false
DisableOnFocusLoss=auto

; Another name for DisableOnFocusLoss, used by another build, so a copied ini keeps working.
; DisableOnFocusLoss wins when both are set. The value moves into DisableOnFocusLoss when the ini is read and this line
; is saved back as auto. No menu control: the Pause NR checkbox of the DLSS NR card shows DisableOnFocusLoss.
; true or false - Default (auto) is false
PauseOnFocusLoss=auto

; Checked/true: run NR before ordinary SR or combined RR+SR on the active colour input.
; Unchecked/false: run NR after either upscaler. Both use WorkingScale and Passes below.
; Before RR, NR processes noisy ray-traced colour; visual results need testing.
; Origin-zero padded inputs use their active size. Invalid/offset colour falls back after upscaling.
; true or false - Default (auto) is false
RunBeforeSR=auto

; Experimental: generate NR before SR, use a separate DLSS SR feature to upscale its
; signed colour contribution, then apply after SR. Overrides RunBeforeSR, not RR.
; Requires a working NVIDIA DLSS SR runtime. Failure leaves the clean upscaled frame.
DeferredDLSS=auto
; Experimental: bound reconstructed edits by the current NR input neighbourhood.
; May reduce PreSR trails at the cost of fine detail. Live toggle; default false.
PreSRTrailGuard=auto
; Experimental FFXIV alternating NR scheduling: NR on A, private SR/FG on B.
; Adds one more rendered frame of scene buffering (two total). Default false.
SplitFrameWork=auto
; Experimental every-other-frame NR with NVIDIA FG on the residual layer.
; Delays SR colour one frame; downstream game effects may use newer-frame guides.
ResidualFG=auto
; Explicit consent to approximate camera transforms when full camera guides are absent.
ResidualFGApproxCamera=auto

; Experimental bottleneck reuse override for alternate/patched NR runtimes.
; Bypasses only the module fingerprint check, not kernel names or launch order.
; Incompatible runtimes can cause corruption or crashes. Default: false.
VitAllowUnverified=false
; Profiling aid for a new NR model file, log only: records the CUDA launches of the first 3 NR evaluations (kernel
; names, grid/block, raw parameter bytes) and dumps the ViT kernel module to OptiScaler\nr-vit-capture\<date-time>\.
; Never drops, changes or delays a launch; works with the override off and with VitEvery=1 or 2. Set it before the game
; starts (the runtime creates its CUDA modules when NR starts). See docs/nr-vit-reuse-profile-runbook.md. Default: false.
VitCapture=false
; Restrict bottleneck reuse to pass 1; later passes compute fully for stability.
; Set false to restore reuse on every pass. Requires VitEvery=2. Default: true.
VitFirstPassOnly=true
; Run the bottleneck on every Nth NR evaluation (the evaluations in between reuse the previous result), 1..2.
; With the default VitFirstPassOnly=true only pass 1 is affected; passes 2 and later always compute fully.
; Default (auto) is 1
VitEvery=auto

; Which NR model file runs. Leave on auto (or empty) for the newest one installed: the nvngx_dlssnr.dll found
; beside OptiScaler or the game, or one inside a folder named NR.<version> (for example OptiScaler\NR.310.9\nvngx_dlssnr.dll).
; Also accepts "legacy" (the file the old search finds, ignoring the NR.* folders) or an exact folder name such as NR.310.8.
; A choice that is not installed never falls back to another model: Neural Rendering is then unavailable and the card says so.
; Changed live from the Neural Rendering card (no restart); not part of the saved NR presets.
; Text - Default (auto) is the newest installed
Runtime=auto

; 0 = NVIDIA (FP8, default), 4 = Experimental (FP8+NVFP4 hybrid).
; VERY minor improvements on Blackwell.
Precision=0

; Optional colour-based final-edit filter (not NVIDIA's semantic AutoMask).
; Warm scenery may match; coloured lighting may hide skin. Preview before relying on it.
; Controls apply once to the combined output of all model passes. 0..1 attenuates the edit.
SkinProtection=false
SkinToneEnabled=true
SkinDetail=1.0
SkinColour=1.0
EnvironmentDetail=1.0
EnvironmentColour=1.0
ShowSkinMask=false

; SR and RR+SR share RunBeforeSR, WorkingScale and Passes.
; Legacy ApplyAfterRR, RRPasses and RRWorkingScale keys are ignored.

; Number of sequential model layers between one encode and one final composition. Each extra layer
; consumes the preceding model output and owns a separate persistent feature/history. 1 is normal;
; 2 and 3 are deliberately over-processed and cost almost exactly 2x and 3x the model time. The final
; answer is composed once against the immutable base proxy, so colour and transfer do not compound.
; Values are clamped to 1..3.
; Default (auto) is 1
Passes=auto
; Optional extended range up to 30 passes. Normal ceiling remains 3; no extra work while off.
; Additional per-pass keys: Pass4Style/Intensity/LocalStructure/LocalTone/SkinStructure/AutoMask, etc.
; Omitted controls inherit pass 1, except later-pass local tone defaults to 0.
UnlockPasses=false
; Spatial feedback between passes: 1 keeps the raw interpass output, below 1 gamut-bounds the edit and
; blends it back toward the preceding input. 0..1. Default (auto) is 1.0
PassFeedback=auto

; How far the frame moves toward the model's picture. Its answer is not added to the frame: it is a
; complete picture, rescaled so its luminance sits where the original says it should, and this blends
; between the two. 0 gives back exactly what the upscaler produced, 1 is the model's picture, and above
; 1 carries on past it.
; Default (auto) is 1.0
TransferStrength=auto

; How a reduced-resolution model result is enlarged. 0 enlarges the complete model output; 1 enlarges
; only its matched residual. This has no effect when WorkingScale is 1.0 or higher.
; Default (auto) is 1 = Matched residual
Transfer=auto

; Whether the model's colour arrives with its light. 0 keeps the game's own hue exactly and lets only
; brightness carry the model's verdict; 1 brings the model's colour as well, in its own hue.
; Default (auto) is 1.0
ColourStrength=auto

; HDR mapping presented to the SDR-trained neural model.
; 0 Soft knee, 1 Neutwo + composed, 2 Neutwo + replace,
; 3 Hybrid + composed, 4 Hybrid + replace, 5 Linear light + composed.
; Linear light shows the model the normalized frame directly (no curve, clipped at white), so saturated highlights
; may change hue. It applies to linear (HDR) input only; tone-mapped SDR input stays passthrough.
; Default (auto) is 0
ReversibleMode=auto

; Where the white point (the linear value the encode maps to display white) comes from. It belongs to
; the game's exposure rather than to any fixed number. Applies only to a linear buffer; a frame the game
; reports as already tone-mapped is passed over untouched.
; 0 the paper white slider only, 1 the exposure the game hands the upscaler, 2 scanned exposure
; (FFXIV DX11 uses verified native lighting for history rejection only).
; Default (auto) is 1
WhitePointSource=auto
; Multiplies the white point before the model sees the frame -- the paper-white control.
; Default (auto) is 1.0
WhitePointScale=auto
; Trim on an exposure-derived white point (WhitePointSource=1), kept apart from the manual divisor.
; 1.0 takes the game's exposure exactly as given. Default (auto) is 1.0
WhitePointTrim=auto
; Trim on the scanned white point (WhitePointSource=2). Default (auto) is 1.0
ScanTrim=auto
; Scan calibration table, "scan:white;scan:white;..." ascending, written by the overlay's anchor buttons.
ScanAnchors=auto
; Whether the scan's number rises (false) or falls (true) with the light. Default (auto) is false
ScanInverted=auto
; Overlay lamp showing what the scan currently thinks the light is doing. Default (auto) is false
ScanMeter=auto
; Run the exposure scan even when WhitePointSource is not 2 (developer override). Default (auto) is false
ScanExposure=auto
; FFXIV native DX11 scanned lighting: reset NR history on abrupt tone changes. Has no effect unless
; WhitePointSource=2 and the verified native scan is fresh. true or false - Default (auto) is true
LightingHistory=auto

; The most the pass may brighten any pixel, as a multiple of what it already was. Darkening is not
; capped. Guards against the model turning a bright light into a string of coloured cells.
; Default (auto) is 2.0
MaxRatio=auto

; What fraction of the frame the model works at. The frame itself is never reduced -- only the model's
; own work is done small and enlarged. Cost falls with the square of this. Above 1.0 (DX12 & Vulkan)
; the model supersamples: it runs above native and the answer is averaged back down.
; Default (auto) is 1.0
WorkingScale=auto

; Depth-aware enlargement of a reduced model (DX12 only). When the model works below the frame's size its answer is enlarged onto
; the frame; at the silhouette of an object that blends in the answer from the other side of the edge. On: each of the four taps of
; that filter is weighted by how close the game's depth under it is to the depth under the output pixel, so the answer stops at the
; edge. It does nothing at model resolution 100% or above and while spatial compression is active. true or false
; Default (auto) is false
DepthAwareResolve=auto

; A different model resolution for each axis (DX12 only; Vulkan and the AMD bridge use WorkingScale for both). 0 follows
; WorkingScale, otherwise the fraction of the frame width (X) or height (Y) the model works at, 0.25 to 2. For example
; WorkingScaleX=0.6 with WorkingScaleY=0 runs the model at 60% across and the WorkingScale value down. Cost falls with the
; product of the two. A mixed above/below 100% model size is not supported: when one axis is above 100% the other is raised to
; 100%. If the model refuses a size that differs per axis, the pass works at WorkingScale on both axes until one of the three
; scale settings changes. Default (auto) is 0 = the same as WorkingScale
WorkingScaleX=auto
WorkingScaleY=auto

; The downscaler that averages the model's answer back to native when WorkingScale is above 1.0
; (supersampling). Independent of OutputScaling/Downscaler, so the two can differ. 0 FSR1, 1 Bicubic,
; 2 CatmullRom, 3 Lanczos2, 4 Lanczos3, 5 Kaiser2, 6 Kaiser3, 7 MAGIC.
; Default (auto) is 4 (Lanczos3)
ScalingDownscaler=auto

; Spatial compression of the model's work area (experimental, 100% of the frame or less).
; SpatialCenterX/Y and SpatialWorkX/Y are percentages (defaults 80, 80, 90, 90); SpatialOffsetX/Y and
; SpatialShiftX/Y default to 0.
; true or false - Default (auto) is false
SpatialCompression=auto
SpatialCenterX=auto
SpatialCenterY=auto
SpatialWorkX=auto
SpatialWorkY=auto
SpatialOffsetX=auto
SpatialOffsetY=auto
SpatialShiftX=auto
SpatialShiftY=auto

; Which profile SpatialCompression drives: 0 Peripheral (the curve above), 1 Foveated. Foveated keeps a full-density centre of
; FoveaWidth x FoveaHeight pixels of the output, eases off over FoveaFalloff pixels and holds FoveaEdgeX / FoveaEdgeY of the
; density (0.25 to 1) out to the frame edge. It uses SpatialOffsetX/Y for placement; SpatialCenter, SpatialWork and SpatialShift
; are Peripheral only. The sizes are clamped to the frame every frame (the stored values are kept) and NR returns to the
; ordinary size by itself when the saving would be under 5%.
; Defaults (auto) are 0, 2400, 1350, 400, 0.5, 0.5 (sized for a 3840x2160 output)
SpatialProfile=auto
FoveaWidth=auto
FoveaHeight=auto
FoveaFalloff=auto
FoveaEdgeX=auto
FoveaEdgeY=auto

; 0 off, 1 the picture the model sees, 2 its raw answer, 3 what it changed amplified twenty times.
; A flat grey difference view means the model is doing nothing.
; Default (auto) is 0
DebugView=auto

; Side-by-side / wipe comparison of the pass against itself: 0 off, 1 side by side, 2 wipe.
; CompareSplit is the wipe position (0..1, default 0.5), CompareZoom 1 fits the frame in each half and 2
; fills it, CompareSwap swaps the sides, CompareTags labels them (TagScale sizes the labels).
; Default (auto) is 0
Compare=auto
CompareSplit=auto
CompareZoom=auto
CompareSwap=auto
CompareTags=auto
TagScale=auto

; Whether the model's edit is applied. Off keeps the pass running (so HoldFrame works) but shows the clean
; upscaler frame. Default (auto) is true
ApplyModel=auto
; Freeze the pass's input so a live setting change re-renders the same frame. Default (auto) is false
HoldFrame=auto

; Writes matched before/after frames to a dlssnr-capture folder beside OptiScaler once, after the first
; 180 frames of the session. Bounded to eight frames, and each run overwrites the last.
; true or false - Default (auto) is false
AutoCapture=auto

; Developer key for checking shader changes. No menu control. When true, a capture (AutoCapture, or the
; dlssnr-capture.trigger file) writes a replay set instead of the before/after frames: two consecutive frames
; with every compute dispatch of the pass, the constants as bound, and the contents of every resource it reads and
; writes, to a replay-<date-time> folder inside dlssnr-capture, beside OptiScaler. Two 4K frames take about
; 0.5 to 0.6 GB on disk and up to about 1.2 GB of memory until the set is written (computed, not measured;
; the recorder stops copying at 3 GiB and the log says what it left out). The write, a few frames later, holds
; the render thread for seconds: a hitch at capture time only. The recorder moves the pass's guide inputs (the
; game's depth and motion when they are used directly) between the shader-read and copy-source states, relying
; on the state the pass already requires of them; the exposure texture is not recorded. Nothing is copied while
; no capture is running. Captures show the screen: never share or commit them.
; true or false - Default (auto) is false
ReplayCapture=auto

; Model controls. Preset and Style are baked into each feature, so changing them causes a guarded
; feature rebuild after the current GPU work retires. The values are undocumented, and the preset
; scale is not the same one Super Resolution or Ray Reconstruction uses.
; Default (auto) is 0
Preset=auto
Style=auto

; Passes 2 and 3 inherit the pass 1 Preset/Style above when left on auto. Set an override to use a
; different built-in model profile for that layer: preset 0..3; style 0 standard, 1 natural,
; 2 cinematic. These select profiles inside the same NVIDIA model DLL, not different model files.
Pass2Preset=auto
Pass2Style=auto
Pass3Preset=auto
Pass3Style=auto

; Per-pass model strengths (shared by SR and RR+SR).
; Auto inherits pass 1, except LocalTone: auto keeps the legacy later-pass value 0.
; Intensity/LocalStructure/LocalTone: 0..2; SkinStructure: -1..2 (-1 follows structure).
Pass2Intensity=auto
Pass2LocalStructure=auto
Pass2LocalTone=auto
Pass2SkinStructure=auto
Pass2AutoMask=auto
Pass3Intensity=auto
Pass3LocalStructure=auto
Pass3LocalTone=auto
Pass3SkinStructure=auto
Pass3AutoMask=auto

; Default (auto) is 1.0
Intensity=auto
LocalStructure=auto
LocalTone=auto
; -1 means follow local structure, which is the model's own default, not a strength of zero.
; Default (auto) is -1.0
SkinStructure=auto
; true or false - Default (auto) is true
AutoMask=auto
