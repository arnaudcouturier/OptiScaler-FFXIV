; Character preview (FFXIV): the game's 3D character preview (character, equipment and glamour windows) gets its own
; treatment. Experimental, off by default; any doubt leaves the game's own drawing untouched. Needs the matched game
; build (the feature switches itself off for the session with one log line otherwise). Section name and key names are
; the ones of the community build this feature follows, so ini files move between builds.

; Isolated DLSS Super Resolution for each preview (render size N x M, output 2N x 2M, separate histories).
; Needs the real D3D11 DLSS runtime to be initialised (the game's own D3D11 DLSS setup provides it). With both
; PreviewDLSS and PreviewAA on, the DLSS pass is used and the spatial AA is bypassed; while the DLSS pass cannot run (its
; runtime is not ready, or it failed and switched itself off), the spatial AA is used instead.
; true or false - Default (auto) is false
PreviewDLSS=auto

; Spatial anti-aliasing of the equipment preview image. It is used while PreviewDLSS is off, and while the PreviewDLSS pass cannot
; run (its runtime is not ready, or it failed and switched itself off). With PreviewNR on, a result NR has for a draw is shown
; instead, so the AA only takes the draws NR has no result for yet (the first frames after a window opens, renders it skipped, a
; preview it cannot process). While the PreviewDLSS pass runs it is not used, also for a draw NR has no result for.
; true or false - Default (auto) is false
PreviewAA=auto

; PreviewAA only: the filtered image is twice the size of the original (2x preview upscaling).
; If the equipment preview looks zoomed or cropped, turn this off.
; true or false - Default (auto) is true
PreviewUpscale=auto

; Diagnostics for the DLSS path: writes up to 12 files (100 MiB) of guide and image dumps into the folder
; OptiScaler\PreviewDLSSDiagnostics next to the DLL, twice per session, and logs the camera and motion ranges.
; Leave off unless you are investigating.
; true or false - Default (auto) is false
PreviewGuideCapture=auto

; Debug aid: mixes a colour into the preview image produced by the spatial AA or by the DLSS pass (magenta), or by preview NR
; (cyan), so you can see in the game which image is displayed. Leave off in normal use.
; true or false - Default (auto) is false
PreviewDebugTint=auto

; Neural Rendering (the DLSS NR model) for each preview, run on the DirectX 12 side of the DirectX 11 on 12 bridge through shared
; images. This is new work and not part of the community build the other preview keys follow. It needs an NVIDIA card, the bridge
; running, nvngx_dlssnr.dll and nvngx.dll_dlssnr.dll, and uses the same [DlssNr] settings as the game image ([DlssNr] Enabled is not
; needed). One extra model per open preview window uses video memory and GPU time (the log reports both); the model is released
; PreviewNRLingerSeconds after its window closes. Alone it runs on the native preview image. Together with PreviewDLSS it runs on
; the DLSS result (twice the size, with the preview's own depth and motion) and the preview's alpha is put back afterwards; for a
; render where NR cannot run, the plain DLSS image is shown. While NR has no result for a draw, PreviewAA (if on) still takes the
; equipment preview, unless the PreviewDLSS pass runs. Any failure switches preview NR off for the session with one log line.
; true or false - Default (auto) is false
PreviewNR=auto

; Seconds a preview's NR model is kept after its window closed, so reopening the window is instant. 0 releases it as soon as the
; window is no longer drawn (a quarter of a second).
; Default (auto) is 5
PreviewNRLingerSeconds=auto

; Show the NR result of the previous frame instead of waiting for this frame's (no GPU wait on the DirectX 11 side, one frame of
; lag). Try it only if the wait is visible in the frame time. Switching it rebuilds the preview's model after half a second.
; It applies to NR on the native preview image only (PreviewNR without PreviewDLSS, or a preview DLSS does not serve); NR on the
; DLSS result always uses this frame's result, and switching this key does not rebuild those models.
; true or false - Default (auto) is false
PreviewNRLate=auto

; Experimental. Run the preview's NR on the picture BEFORE the DLSS step instead of after it: the render-size image (with the preview's own
; depth and motion) goes through the NR model and the result is what DLSS upscales. The model works at the render size, not at twice the size, so it is expected to use less GPU time and
; video memory per open window than NR on the DLSS result (not measured yet; the log's cost lines show the real figures). The picture can differ: NR then sees a
; jittered, not yet anti-aliased image, so look for shimmer or trails on hair and cloth and switch it off if you see any. It only has an effect
; with PreviewDLSS and PreviewNR both on. If the DLSS step refuses the NR image, the render is done with the plain image, NR before DLSS is
; switched off for the rest of the session with one log line, and NR runs after DLSS as usual. PreviewNRLate does not apply to it (the
; result is always used in the same frame). Switching it rebuilds the preview's model after half a second.
; true or false - Default (auto) is false
PreviewNRBeforeSR=auto

; Debug probe for the preview: traces how the processed preview image reaches the screen (copies of the preview into other
; textures, draws that sample the preview or a copy of it) and writes log lines. It can also save preview images (PNG)
; and run live commands from the file OptiScaler\chara-probe.cmd. Files go to OptiScaler\PreviewDebug next to the DLL
; (at most 40 files / 300 MiB per session; each image is two files, picture and alpha, so a dump with the native, AA, DLSS and NR
; images is 9 files). The limit is per game start and nothing deletes old dumps: the folders pile up (up to 300 MiB per game start), so delete
; OptiScaler\PreviewDebug yourself when you are done. Costs a few texture lookups per draw while on. Leave off in normal use.
; true or false - Default (auto) is false
PreviewProbe=auto

; Debug aid: draws the preview as solid magenta wherever the game samples it (works without PreviewAA or PreviewDLSS), so
; you can see in the game whether the replacement reaches the visible pixels. Leave off in normal use.
; true or false - Default (auto) is false
PreviewDebugFlood=auto

; Diagnostics, leave off in normal use. The replay that produces the preview's signed motion vectors normally only takes a G-buffer
; draw whose vertex and pixel constant buffers are exactly the 59-float4 camera block (944 bytes). With this on, any constant buffer
; size that can hold the camera block is accepted; the draw must still write the preview renderer's own G-buffer. A shader that reads
; the camera block as a view into a larger buffer is then replayed too, so more pixels get motion vectors and the picture can change:
; look for shimmer on hair and cloth and switch it off if you see any.
; true or false - Default (auto) is false
PreviewReplayWideShape=auto

; Experimental. With this on, only PreviewMaxWindows preview windows get the DLSS pass and preview NR; the others keep the game's own
; picture and are not jittered. A window is recognised by the camera constant buffer it draws with (the buffer, its first constant and the
; render size), without reading anything back from the GPU, so a render whose window cannot be recognised yet runs untouched. If the game's
; windows cannot be told apart, none of them is processed and each keeps the game's own picture; the log line "preview identity" shows it. A
; window that draws and is on screen takes the place of a window that has not been drawn for a quarter of a second, at most one exchange per
; quarter second, so a hitch does not rebuild the whole set; two windows that alternate keep their places, and closing a processed window
; hands its place to a waiting one. Every processed window costs GPU time and video memory, so a view with several characters is smoother
; with two than with all of them. Off by default: every preview window is processed as before.
; true or false - Default (auto) is false
PreviewBudget=auto

; How many preview windows are processed while PreviewBudget is on (1 to 8; the preview renderer has eight output entries). Two covers the
; character window plus one more (examine, try-on, dye). Not read while PreviewBudget is off.
; Default (auto) is 2
PreviewMaxWindows=auto

; Read-only look at the game's own camera jitter (FFXIV, matched game build only). About every 10 seconds, and when the render size or preset changes, it
; writes one log line comparing the jitter the game APPLIES to the picture with the jitter it REPORTS to the upscaler (both axes, the signs,
; the ratios and the implied scale s; s = 2 means they agree), plus the render size and preset of that moment. It only reads game memory, never
; writes it, and any failed check logs one line and stops. Costs nothing while off. Leave off in normal use.
; true or false - Default (auto) is false
JitterProbe=auto

; Experimental. In game the picture moves by only about 60% of the jitter the game reports to the upscaler (measured with JitterProbe, at DLAA and at
; Performance). This switch learns that ratio from the game's own camera jitter object (five agreeing readings in a row, checked against every later
; reading) and multiplies the Jitter.Offset values of EVERY DLSS evaluate by it, so the upscaler is told the jitter that is really in the picture. The
; game's values pass through unchanged for an unknown game build, while the correction is off, and while the ratio is being learned (the first seconds,
; and again after a new render size or preset); a ratio above 1.02 or below 0.25 is refused and passes them through too. Once a ratio is adopted it
; keeps being applied even when the game's object cannot be read for a while (the ratio is a property of the game's formula, not of a frame); the log
; says "verification stale" after 10 seconds without a usable reading. A game that already hands the upscaler what it applies is never
; touched. Everything that reads the parameter block after the write gets the scaled pair, not only the super resolution: frame generation (also its
; guide-delay mode), the DLSS-NR path, the Jitter Count shown in the menu, and the FSR or XeSS backend if one of them is selected. Test with frame
; generation off first; with it on, "correction on or off" changes the upscaler and frame generation together. It does not depend on JitterProbe. The
; log says when the ratio is ready ("Jitter correction: calibrated ratio ...") and a status line with totals follows about every 10 seconds at first,
; then once a minute. Meant to be switched on for a test and compared with it off. Leave off in normal use.
; true or false - Default (auto) is false
JitterCorrection=auto

; Experiment, for testing only; may be removed once the correction has been validated. A fixed scale for the jitter the game reports to the
; upscaler, used INSTEAD of the ratio the correction learns. Valid values are 0.25 to 1.0. Try 1.0 (nothing is changed, the baseline), 0.8, 0.6 and 0.5
; one after the other and compare the picture. 0 means off: the correction learns the ratio itself. Any other value is ignored (the log says so once).
; Only used while JitterCorrection=true. The menu changes it live. Test with frame generation off first.
; A number from 0.25 to 1.0, or 0 for off - Default (auto) is 0
JitterScaleOverride=auto

; Experimental. Fixes the game's jitter at the source instead of only telling the upscaler something else. In DLSS mode the game draws with only about
; 60% of the sub-pixel jitter its generator produces (+-0.3 pixel instead of +-0.5 pixel) and its jitter pattern never repeats. With this switch on, the
; fork divides the generator's output by the game's own native strength, so the full +-0.5 pixel lattice is drawn; replaces the endless pattern by
; NVIDIA's repeating cycle (8 * output area / render area phases: 8 at DLAA, 18 Quality, 24 Balanced, 32 Performance, 72 Ultra Performance, recomputed
; whenever the sizes change); and tells super resolution and frame generation exactly the offset that was drawn.
; While it is active JitterCorrection stands down for every evaluate the fix tells (it never scales on top of a told offset; an evaluate the fix could
; not tell is left to the correction as before). If the switch is off, the game is not the supported game build, an
; instruction check fails, a hook cannot be installed, or the check in the log ("Jitter source: verified ...") fails, the game and JitterCorrection
; behave exactly as without it. Switching it on installs two hooks in the game on the next frame; switching it off makes them pass straight through.
; Test with frame generation off first and compare with the switch off.
; true or false - Default (auto) is false
JitterSource=auto

; Game build handling. The fork finds the game's internal addresses itself (it searches the executable's code for the same instruction patterns
; the supported build was verified with) and checks them against its table of the supported build; a game patch no longer stops the features
; that only identify the game by its program name or by shader fingerprints (scene HDR, lighting, HUD-less, markers, mip bias, and so on): they
; run on any ffxiv_dx11.exe. The features that read or hook the game's own code (the native quality selection and the DLAA gate, the
; jitter probe and the jitter source fix, the character preview lookup) run on the supported build as before, and on a patched build only when
; FfxivUnknownBuildHooks is on and the search found every address it needs (the log says which and why, one block starting with
; "[ffxiv-gate]" and one line per address starting with "[ffxiv-resolve]" after the game's first device is hooked). These three switches are read
; once at start. No menu control.

; Rollback. true: exactly the behaviour before the address search existed: the supported build is recognised by its exact build stamp and size,
; the table is used as it is, nothing is searched, and every feature of the game module (also the ones that only need the program name) runs only on that exact
; build and not at all on a patched one. Use it to compare, or if the address search ever misbehaves. No menu control.
; true or false - Default (auto) is false
FfxivLegacyGameBuild=auto

; The features that read or hook the game's own code, on a game build the fork has no table entry for (after a game patch): allowed only when
; every address and structure offset they need was found by the search. Off until this has been proven on a real patch; until then a patched
; game runs without those features (the log says so). Has no effect on the supported build. No menu control.
; true or false - Default (auto) is false
FfxivUnknownBuildHooks=auto

; Debug. Ignore the table of the supported build, as if the game were patched, so the address search alone (and the checks that follow it) can
; be tried on today's executable. The features that read the game's code then also need FfxivUnknownBuildHooks=true. Leave off in normal use.
; No menu control.
; true or false - Default (auto) is false
FfxivForceUnknownBuild=auto

; Automatic scene depth for ReShade. When the game renders below the output size (DLSS Quality and below), its scene buffers are still output-sized and
; only a window of them holds this frame, so the depth that ReShade finds (Generic Depth) does not line up with the picture and effects that read it
; (MXAO, XeGTAO, Glamarye, ...) misfit. With this switch on, OptiScaler copies the depth the upscaler is given into a texture of the size of ReShade's
; back buffer, scaled by nearest sampling from the render window, and hands it to ReShade's DEPTH input while it renders its effects; the original
; depth input is put back afterwards. Needs ReShade 6.8 or newer (add-on API 20), loaded in the game (also as dxgi.dll; it is looked for while this is
; on). Effects without a depth input are not touched. It stands down only while any of RESHADE_DEPTH_INPUT_X_SCALE, _Y_SCALE, _X_OFFSET, _Y_OFFSET,
; _X_PIXEL_OFFSET, _Y_PIXEL_OFFSET is defined with a non-neutral value (neutral: 1 for the scales, 0 for the offsets), globally or for an effect with an enabled technique. The game's depth is reverse-Z: effects may
; need RESHADE_DEPTH_INPUT_IS_REVERSED=1 (if ambient occlusion looks inverted with this on, set it to 1 in ReShade's preprocessor definitions). Switching it on
; takes effect within a few frames, no restart. The status line of the menu card says what it is doing. That the depth does not line up is inferred from
; the buffer sizes in earlier logs until the capture line in OptiScaler.log shows the real depth size.
; With it on, the game's normals, decals, motion vectors and material that an add-on such as REST hands to ReShade are realigned with the picture as well
; (the same stretch of the render window to the output size as the depth; a depth subrect base other than 0,0 leaves them alone). The motion vectors are
; stored relative to the output-sized allocation, so their values are also multiplied, per axis, by the motion vector scale the game reports to the upscaler
; divided by the render size (3840 / 1920 = x2 at DLSS Performance; output / render when the game reports none).
; true or false - Default (auto) is false
AutomaticReShadeDepth=auto

; Developer diagnostic, ini only. No menu control: off | capture. With capture it writes the draw order of a few complete frames of the
; session to OptiScaler\draw-diag\<run>\ next to the DLL (the five newest runs are kept): draws.csv (one row per draw: ordinal, draw call,
; pixel shader CRC and stage, the reflected names and slots of the resources and constant buffers it binds, every render target's format
; and size, the depth view, the viewport, the blend and depth state, and the tone map / first UI draw / upscale boundary markers) and
; cb.csv (the sun position, direction and colour of the g_LightParam constant buffer of the lighting passes, read back at most once a
; second). Log only: nothing in the frame changes. The pixel shaders' reflected names are recorded when the shaders are created, so set it
; before the game starts; a capture happens once per session. Costs one relaxed atomic load per draw while it is off, and a few milliseconds
; per frame while it runs. Developer use only.
; off or capture - Default (auto) is off
DrawDiagnostics=auto

; Developer diagnostic, ini only (see DrawDiagnostics). No menu control: how many complete frames one capture writes. A frame with fewer
; than 32 draws (a loading screen) is skipped, so this counts rendered frames. 1 to 16; anything else is clamped.
; Default (auto) is 3
DrawDiagnosticsFrames=auto

; Developer diagnostic, ini only (see DrawDiagnostics). No menu control: how long after the game starts the capture begins, in seconds
; (0 to 3600). With 0 the capture collects the opening frames, which on a real session is the loading and logo frames; a delay puts it on
; a gameplay frame, where particles and effects are drawn. While it waits the diagnostic still reads the g_LightParam and g_CameraParameter
; constant buffers once a second, so cb.csv holds one sample per second over the whole wait. Default (auto) is 0
DrawDiagnosticsDelaySeconds=auto

; Developer diagnostic, ini only (see DrawDiagnostics). No menu control: a key that starts the capture instead of the delay, so it lands on
; the frame the player chose. A letter (A to Z), a digit (0 to 9) or F1 to F24; the press does not need the game's window focused, and it is
; read only while the diagnostic is armed. The key wins over DrawDiagnosticsDelaySeconds when both are set.
; off, A to Z, 0 to 9 or F1 to F24 - Default (auto) is off
DrawDiagnosticsKey=auto

; Developer diagnostic, ini only (see DrawDiagnostics). No menu control: writes the targets of ONE captured frame to
; OptiScaler\draw-diag\<run>\dump\ as raw bytes (.bin files) plus a facts.txt with each file's format, size, row pitch, the draw that
; identified it and its pointer: the wetness pass target, the five G-buffer targets, the two light buffers, the hierarchical-Z
; (screen-space reflection) target, the scene the tone map reads, the view-position buffer the water and composite draws sample, the
; tone map's target and the post-tone-map FP16 copy. Nothing in the frame changes; the copies are staging readbacks of targets that were
; already drawn. It needs a capture of at least two frames and runs once per session.
; off or frame - Default (auto) is off
DrawDiagnosticsDump=auto

; Developer diagnostic, ini only (see DrawDiagnostics). No menu control: the byte budget of the one-frame dump, in MiB (64 to 4096;
; anything else is clamped). At a 3840x2160 frame's size the whole set of files is about 514 MiB with the view-position buffer (451
; MiB without it) and about 546 MiB when the SSR target is written too; the default 256 holds the wetness target, the five G-buffer
; targets and one light buffer of such a frame (about 230 MiB). The files are taken in their order of importance, so a texture that does
; not fit the budget is skipped with a line in facts.txt instead of taking the place of one that matters more.
; Default (auto) is 256
DrawDiagnosticsDumpBudgetMiB=auto

; Contact shadows before the game's sun light pass. Experimental: the effect is not verified in game, and on the one benchmark frame that
; was dumped its term mostly did not land on contact edges (3.0 % of its texels were on one). Off by default.
; The engine writes a screen-space sun visibility mask and its sun light draw samples it; this adds the short-range shadow the cascade map
; cannot resolve (a character's feet, a prop on the ground) by marching half a metre along the sun direction over the depth buffer, and
; multiplies the result into a private copy of that mask for that one draw. Before DLSS, before the tone map, before the UI.
; The mask is recognised by its reflected name and by its shape, and both measured builds are accepted: this game's light draw names it
; g_SamplerShadowMask and binds it as R8_UNORM, while the benchmark build named it g_SamplerShadow and bound it as B8G8R8A8_UNORM. The
; cascade shadow atlas the other name belongs to is refused by its format and its size, so it is never mistaken for the mask. Every screen
; the pass cannot measure is left exactly as it was (one log line says why), and it stands down for the session after sixteen refused light
; draws in a row. The card shows how many passes ran, how many light draws were served and refused, and the mask of the last classified
; light draw, so a session can tell a build this rule does not recognise from an effect that is simply subtle.
; true or false - Default (auto) is false
ContactShadows=auto

; Contact shadows: how far from the surface the ray looks for an occluder, in metres (0.05 to 2.0).
; Default (auto) is 0.5
ContactShadowsLength=auto

; Contact shadows: how much of the sun's visibility the contact occlusion takes away, 0 to 1 (0.5 is half). The engine's mask is 8-bit, so
; the term lands on whole levels of 1/255. 0 runs nothing at all.
; Default (auto) is 0.5
ContactShadowsStrength=auto

; Contact shadows: steps of the march, 4 to 64, each at most one pixel long, so a thin occluder is never stepped over. More steps reach further
; from the surface up close, and cost more.
; Default (auto) is 32
ContactShadowsSteps=auto

; Contact shadows, ini only. No menu control: which space the game reports its sun direction in. The measurement this feature was built on
; found view space (the direction turns with the camera while direction * g_CameraParameter's view matrix stays the same per scene), so auto
; reads as view; world is kept for a build where the same measurement has to be redone and comes out the other way round
; (docs/notes/contact-shadows.md has the protocol).
; auto, world or view - Default (auto) is auto (view)
ContactShadowsSunSpace=auto

; Contact shadows, ini only. No menu control: which way the game's sun direction points. auto reads as "toward the sun", which is what the
; measured vector (0, 0.8, 0.6 - pointing up) reads as and what the ray has to trace; from makes the pass trace the opposite way, for a
; build whose direction turns out to be the way the light travels.
; auto, toward or from - Default (auto) is auto (toward)
ContactShadowsSunSign=auto

; Contact shadows, ini only. No menu control: writes one frame out for the developer check, at the first sun light draw that runs this many
; seconds after the game starts. That one frame holds the engine's sun mask before the pass (its file name says its format: mask-before.r8 for
; this build's R8_UNORM mask, one byte per texel), the half-resolution term, the mask copy the draw sampled, the depth, the camera matrices and
; the sun vector, plus a text file with the sizes and the keys. The same key keeps the bytecode of every shader that declares the sun mask from
; the moment the game creates it, and the dump writes those blobs too: the mask's texels and the channel the light draw reads are what settle
; which level of the mask means sunlight. All of them come from the same GPU frame, so a comparison of them has none of the run-to-run noise two
; benchmark runs have. Files go to contact-dump folder beside the DLL. 0 writes nothing; one frame per session.
; 0 to 3600 seconds - Default (auto) is 0 (no dump)
ContactShadowsDump=auto

; Engine pass overrides. Experimental: the visible effect is not verified in game yet. Lets this fork change one of the engine's own rendering
; parameters for a single draw without touching the game's memory: the draw is recognised by the parameter buffers its shader declares, the
; buffer is copied on the GPU, scaled, bound for that one draw, and the game's own buffer is put back. Every screen the module cannot measure
; is left exactly as it was (one log line says why), and it stands down for the session after sixty-four refused draws in a row. Off by
; default; the first knob is the ambient sky visibility below.
; true or false - Default (auto) is false
EnginePassOverrides=auto

; Engine pass overrides: scales the sky light the ambient probes contribute: the probe's sky visibility where the composite honours it, and
; the probe's SH reciprocal scale everywhere, which also dims the probe's share of the indirect specular reflection. 1.0 is the engine's own
; picture and runs nothing at all; lower values darken the flat sky-lit fill of a night without touching the artists' baked values, the direct
; light or the shadows. The engine only binds this table at the deferred composite draws.
; 0.0 to 2.0 - Default (auto) is 1.0 (the vanilla picture)
AmbientSkyVisibilityScale=auto

; Engine pass overrides: the wetness the engine applies to the ground. -1 is the engine's own value and runs nothing at all; 0.0 forces dry
; ground and 1.0 full wetness, whatever the weather is, and the engine's own dryness blend follows the forced value. The engine ramps its wetness
; with the weather, so this replaces the ramp; the rain-exposure mask it computes is untouched, so the gloss appears under open sky and not under
; cover. Grass has no gloss response: judge it on stone.
; -1.0 to 1.0 - Default (auto) is -1.0 (the engine's own value)
WetnessOverride=auto

; Ambient occlusion (FFXIV). Experimental: tried in game in one session, where the user confirmed the pass works, and the fixed picture and the
; pause have not been judged again. This fork computes its own ambient occlusion from the game's depth and its G-buffer normal, into a texture of
; the engine's own size and format, and every draw of a frame from the reader that completes the pass's three inputs onward that would sample the
; engine's screen-space occlusion samples this fork's for that one call; a reader of that frame before the completing one keeps the engine's
; texture, and the game's own texture is bound again afterwards. Nothing of the game is written and no shader of the game is replaced; any frame
; this module cannot measure keeps the engine's texture, and after sixty-four frames in a row left alone (one count a frame, at its first wait or
; its refusal) the pass pauses, inspects every reader of one frame again about 2.7 seconds later (120 frames at 45 frames a second) and re-arms at
; the first frame it can serve. Off by default: the switch off is the engine's own picture, and so is a strength or a blend of 0.
; true or false - Default (auto) is false
AmbientOcclusion=auto

; Ambient occlusion: how far around a pixel the search looks, in metres of world. A larger radius darkens more of a room and costs nothing
; extra: only the picture changes. 0.1 to 4.0
; Default (auto) is 1.0
AmbientOcclusionRadius=auto

; Ambient occlusion: how much of the computed occlusion is applied. 1.0 is the algorithm's own answer, above 1 exaggerates it, and 0 runs
; nothing at all (the engine's own texture stays bound). 0.0 to 2.0
; Default (auto) is 1.0
AmbientOcclusionStrength=auto

; Ambient occlusion: how much of this fork's occlusion is applied on top of the engine's own. The two are multiplied, so 1.0 applies both,
; 0.5 applies half of this fork's contribution, and 0 runs nothing (the engine's own texture stays bound). At 1.0 a term this fork finds
; nothing in leaves the engine's occlusion exactly as it was. Lower values are the first thing to try when the picture looks too dark. 0.0 to 1.0
; Default (auto) is 0.5
AmbientOcclusionBlend=auto

; Ambient occlusion: how many depth taps a direction the search takes (4, 8 or 16). This is the one setting that changes what the pass costs
; on the GPU, roughly in proportion; measure before raising it. low, medium or high, anything else reads as medium.
; low, medium or high - Default (auto) is medium
AmbientOcclusionQuality=auto

; Puddles (FFXIV). Experimental: the visible effect is not verified in game yet. Rain makes the ground glossy; this fork adds the standing water
; in two stages that read one noise field anchored to the world. Once a frame, before the light passes, it copies one of the engine's own G-buffer
; targets, replaces the gloss channel of the ground where a puddle is, and binds that copy for every draw of the frame that binds the same target
; object as the frame's first reader. At the tone-map draw it then darkens the pool's lit colour and adds a marched reflection of the scene to it,
; with water's Fresnel: the mirror is the scene the frame has already drawn, not the engine's 256-square environment probe. The engine's own wetness
; amount ramps both stages up with the rain and down as it dries (while the engine pass's wetness knob is armed, the amount it forces is the one the
; engine's own draws read, so it is the one the puddles use too), so there is no timer and nothing is remembered between frames. Nothing of the game
; is written and no shader of the game is replaced; a frame the pass cannot serve is skipped with one log line, and only a frame it cannot do the
; work for (an allocation, a draw, a throw, a target of a format it cannot copy) counts towards the sixty-four in a row that switch it off for the
; session. Off by default, and a coverage of 0 is the engine's own picture.
; true or false - Default (auto) is false
Puddles=auto

; Puddles: how much of the ground that faces up becomes puddle at full rain, 0 to 1. 0.42 puts about a third of it in pools (measured on the
; shader's own field over one full 64-cell period): the rest stays damp with the engine's own glossy sheen, which is what makes the pools read as
; pools. 0.0 runs nothing.
; 0.0 to 1.0 - Default (auto) is 0.42
PuddlesCoverage=auto

; Puddles: the size of one patch of the noise field, in metres: a pool is a few cells across, so 6.0 puts the median pool at about four metres
; across and the largest tenth near twelve, which is what a 60 m patch of the field measured. Larger values make broad sheets, smaller ones a wet
; grain. The field is anchored to the world, so it stays where it is while the camera moves. The pool's edge is the same field at the edge softness
; below.
; 0.05 to 16.0 - Default (auto) is 6.0
PuddlesScale=auto

; Puddles: the half-width of a puddle's edge, 0 to 0.5 of the noise field's range. 0.03 gives the sub-metre edge the reference's stone has (0.8 m
; at the default scale); near 0.0 the puddles get a hard outline, which also shows the 8 bits the engine's target is stored in.
; 0.0 to 0.5 - Default (auto) is 0.03
PuddlesSoftness=auto

; Puddles: which of the engine's G-buffer targets carries the channel to shape, 1 to 2. 1 is the material pack, whose alpha is the gloss the
; engine's composite reads. Only the engine's 8-bit targets can be shaped: 3 is a 16-bit target and 4 is the world-space normal this pass reads to
; decide what faces up, so neither is offered here (an ini value of either binds the engine's own target unchanged and says so in the log).
; 1 to 2 - Default (auto) is 1
PuddlesGlossTarget=auto

; Puddles: which channel of that target is replaced: r, g, b or a, anything else reads as a. `a` is the material pack's gloss. The other three
; channels are the engine's own bits, untouched, so a channel whose meaning has not been measured cannot be corrupted by this pass. `r` on target 1
; is the one pair the pass refuses: the engine's composite and its wetness pass read that byte as a selector and choose the surface encoding by
; it, so writing it tints the ground.
; r, g, b or a - Default (auto) is a
PuddlesGlossChannel=auto

; Puddles: the channel value of a mirror-wet surface, 0 to 1. The engine's own gloss sits at about 0.83 on wet ground, so 1.0 is wetter than the
; weather; 0.0 is for a channel that is a roughness instead of a gloss. Whichever way round it is, the puddles take this value and the dry ground
; keeps the engine's own. Inside the pool this value is also what a mirrored ray that found nothing falls back to: the engine's own probe
; reflection of that ground, sharpened, darkened by PuddlesDarkening - never black.
; 0.0 to 1.0 - Default (auto) is 1.0
PuddlesGlossWet=auto

; Puddles: the mirrored reflection of the scene at the tone-map draw. `true` marches the frame's own view positions from each pool texel and adds
; what the ray hits with water's Fresnel (about 2 % straight on, most of it at a grazing angle). Judge it from the reference's own pose: level, at
; eye height, the fountain six to ten metres ahead - below about three metres the Fresnel makes the mirror invisible and the darkening carries the
; pool. `false` is the darkening alone, which is the A/B a session needs to judge the shape before the mirror. Nothing is remembered between frames,
; so the pass cannot ghost on its own; it is one sample of the scene per texel, so an upscaler or frame generation may shimmer or smear the hit's
; edge, and that is expected rather than a fault.
; true or false - Default (auto) is true
PuddlesReflection=auto

; Puddles: how much of the Fresnel reflection the marched colour is added with, 0 to 1. 0.0 is the darkening alone; 1.0 is the scene's own
; colour at full Fresnel, which is a perfect mirror where the angle is right.
; 0.0 to 1.0 - Default (auto) is 0.6
PuddlesReflectionStrength=auto

; Puddles: how much of the lit colour a full puddle takes away, 0 to 1. This is the part that makes the ground read as water instead of varnish, and
; the reference's wet stone is dark even where no reflection lands; 0.45 keeps a little over half of the colour inside a pool. It is also the risky
; half of the look at night: a night stone sits near 0.10, so a full pool at 0.45 lands near 0.05 and reads as a hole where the mirror misses.
; 0.0 to 1.0 - Default (auto) is 0.45
PuddlesDarkening=auto

; Puddles: how much a fixed ripple field tilts the mirror's normal, 0 to 1. The slope comes from the same world-anchored noise as the pool, so it
; is the same in every frame and cannot crawl; 0.0 is a flat mirror of the stone joints.
; 0.0 to 1.0 - Default (auto) is 0.35
PuddlesRipple=auto

; Puddles: how many taps the mirrored reflection's march takes, 8 to 48. This is the one setting that changes what the tone-map stage costs on the
; GPU, roughly in proportion; a pool's mirror is a wide, smooth thing, so the default is half of the water reflection's 48. The cost is expected to
; be 0.4 to 1.3 ms at 1080p, unmeasured on a real card: about 690,000 pool texels (a third of a 1920x1080 window) times 24 taps. A session reads
; the pass's own figure from the log line instead of trusting this.
; 8 to 48 - Default (auto) is 24
PuddlesReflectionSteps=auto

; Puddles: how far from the camera a pool may sit, in metres, 0 to 64. The G-buffer beneath a forward draw - the ocean, the lakes, the rivers - is
; the up-facing ground under the water, so past the reach the tone-map stage keeps the engine's own texel instead of painting pools onto the water.
; The measured water blotches sat between 25 and 40 m with the camera at eye height; the beach pools a player reads sit inside 24 m. 0 disables
; the gate.
; 0.0 to 64.0 - Default (auto) is 24
PuddlesReach=auto

; Light shafts. Experimental: the visible effect is not verified in game yet. The sun's light is scattered through the frame: the depth buffer
; gives the sky, a radial blur carries it toward the sun's position on screen, and the result is added to a copy of the lit scene that the tone
; map reads for that one draw. The game's own scene is only read, never written, and every frame the module cannot measure is left exactly as it
; was (one log line says why); it stands down for the session after sixty-four refused draws in a row. Inactive while the engine's scene HDR is
; on, because that path replaces the tone map this pass draws before. Judge it with the sun low in the frame, behind trees or a roof edge. Off by
; default; the five keys below tune it.
; true or false - Default (auto) is false
LightShafts=auto

; Light shafts: how much light the shafts add, 0 to 2, as a share of the white the pass reads (the tone map's own exposure multiplier's
; reciprocal, held between 0.15 and the measured 0.838). 0.0 turns the pass off (the frame costs one test per draw and nothing else); 1.0 is a
; clear glow around a low sun (about a tenth of that white); 2.0 is the strongest the slider goes - the addition is bounded by each pixel's room
; to that white, so no key pushes a channel past the white the pass reads. A wrong-high live exposure on a much darker frame still over-lights
; it (the band cannot tell a wrong value from a bright frame), and while the exposure has not landed the white is the band's dark end, 0.15.
; 0.0 to 2.0 - Default (auto) is 1.0
LightShaftsIntensity=auto

; Light shafts: how fast a sample toward the sun fades, 0.80 to 1.00. Higher keeps the shafts reaching across the frame; lower keeps them a
; glow around the sun's own pixels.
; 0.80 to 1.0 - Default (auto) is 0.96
LightShaftsDecay=auto

; Light shafts: the blur's sample count, 16 to 96. More samples are smoother and cost more on the GPU; the pass runs at half the render size.
; 16 to 96 - Default (auto) is 48
LightShaftsSamples=auto

; Light shafts: how far each sample reaches toward the sun, 0.10 to 1.50. Above 1.00 the blur samples past the sun, which spreads the shafts
; over the whole frame.
; 0.1 to 1.5 - Default (auto) is 0.9
LightShaftsDensity=auto

; Light shafts: which colour the shafts take. auto is the sun's own colour - the engine's colour for that light when it reports one, and
; otherwise the sky's colour around the sun's screen position (only sky pixels are sampled, so what stands in front of the sun cannot tint the
; shafts), which is what today's build needs (its directional light reports a zero colour). A frame with no sky around the sun adds nothing. white
; is a neutral shaft tinted only by the intensity key, for telling a colour problem from a geometry problem; it has no brightness floor of its
; own, so a white run at night glows.
; auto or white - Default (auto) is auto
LightShaftsColor=auto

; Screen-space reflections (FFXIV). Experimental: the visible effect is not verified in game yet. This fork computes its own reflection for
; the water surfaces: once a frame, before the first water draw, it marches the game's view-position buffer against the scene the frame has
; already rendered, into a texture of the engine's planar reflection map's own size and format, and every water draw of that frame that would
; sample the engine's map samples this fork's for that one call; the game's own texture is bound again afterwards. Where the march finds
; nothing the engine's own texel is kept untouched, no shader of the game is replaced, and the pass switches itself off for the session after
; sixty-four refused water draws in a row. Off by default: the switch off is the engine's own picture, and so is a blend of 0.
; true or false - Default (auto) is false
ScreenSpaceReflections=auto

; Screen-space reflections: how many taps the ray march takes. This is the one setting that changes what the pass costs on the GPU, roughly
; in proportion; measure before raising it. More steps find thinner and farther reflections, not brighter ones. 16 to 128
; Default (auto) is 48
ScreenSpaceReflectionsSteps=auto

; Screen-space reflections: how deep behind a crossing ray a surface still counts as the one the ray hit, in metres of world. Too small and
; a thin reflection (a railing, a mast) is missed; too large and a wall the ray passed a metre ago paints the water. 0.05 to 2.0
; Default (auto) is 0.3
ScreenSpaceReflectionsThickness=auto

; Screen-space reflections: how much of this fork's reflection replaces the engine's own where the march found something. 1.0 is this fork's
; only, 0.5 mixes the two equally, and 0 runs nothing (the engine's own map stays bound). The default mixes the two, because a 100 % traced
; reflection over a shallow shore reads as a hard cut-out instead of water. 0.0 to 1.0
; Default (auto) is 0.5
ScreenSpaceReflectionsBlend=auto

; Screen-space reflections: the fraction of the picture at its edges over which a reflection is trusted less and less, so a hit that runs out
; of screen fades out instead of ending at a hard line. 0.0 trusts a hit right up to the edge. 0.0 to 0.5
; Default (auto) is 0.15
ScreenSpaceReflectionsFade=auto

; Developer probe, ini only. No menu control: does the upscaler read a mask at all? The game hands it none, so this feature is the
; first producer of one: a constant R8_UNORM mask the size of the picture, one half full (1.0) and one half empty (0.0), is put in
; the mask input of the upscaler (DLSS bias current colour mask, which the FSR and XeSS backends also read as their reactive and
; responsive masks). Compare two screenshots of the same still scene with the probe off and on: two frames never match bit for bit,
; so the half that is NOT masked is the noise floor. If the on-versus-off difference is clearly larger in the masked half (and it
; looks more aliased or shimmery there), the backend reads the mask; if the two halves differ about equally, it ignores it. left or
; right picks which half is masked, so one picture shows both. One log line says which backend received the mask and whether the
; parameter block reported it back; nothing is written on a frame the probe cannot build a mask for, so without the key the game's
; own value for that input is used, as always. Costs one load per evaluate while off. Leave off in normal use.
; off, left or right - Default (auto) is off
VfxMaskProbe=auto
