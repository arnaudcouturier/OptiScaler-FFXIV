; Live frame-generation output switch. With this on, changing the frame generation output while the game runs moves the
; output chain to the new provider (FSR FG, XeFG, or plain presentation) instead of asking for a restart. With it off,
; changing the output has exactly the effect it has always had: none until the game is restarted.
; It moves between the three outputs of the DX11 to DX12 bridge (plain presentation, FSR FG, XeFG), in all six directions,
; from a run that booted with FSR FG or XeFG (a run with frame generation off has no input path to switch to). The six
; directions were verified on the official benchmark (windowed), in runs that booted with FSR FG and in runs that booted
; with XeFG; not yet in a game session. Every attempt is judged by the presents of the new chain: a chain
; that fails is put back to plain presentation and that target is remembered until the game restarts. A session allows a
; few switches; after that the game has to be restarted for another one.
; true or false - Default (auto) is false
FGOutputHotSwap=auto

; The release-model probe. Off by default. With it on, the first present of the DX11 to DX12 bridge reads the live
; chain once - its reference count, the library its present slot lives in, and one test present - and writes one
; [fg-probe] line per result. It creates and destroys nothing: the measurement that releases a reference runs in the
; separate probe host (tools/fg-probe), never in the game's process. No menu control: it is a developer measurement.
; true or false - Default (auto) is false
FGOutputSwitchProbe=auto

; Diagnostic: a timed script of output changes, in seconds from the first bridge present, for the benchmark. Each entry is
; seconds:target (target is none, fsrfg or xefg), separated by commas, for example 45:xefg,90:none,135:fsrfg. A step with an
; unknown target or a missing time is dropped and the rest of the list still runs. Read once, at the first present, and
; honoured only while FGOutputHotSwap is on; a scripted step does not survive an ini write.
; No menu control: it is a benchmark key.
; empty or <seconds:target,...> - Default (auto) is empty, nothing scripted
FGOutputSwitchScript=auto

; Diagnostic: force one named step of the switch to fail once, so the rollback to plain presentation can be proven in a real
; process instead of only in the simulation. One of: drain, teardown, create, adopt, replay, probation. The probation
; fault fires inside a probation only, so it always ends in a rollback to plain; the teardown fault ends the session,
; because a chain that cannot be freed leaves the window bound. Read once, at the first present, and honoured only while
; FGOutputHotSwap is on. Empty = no fault.
; No menu control: it is a benchmark key.
; empty or <step> - Default (auto) is empty, no fault
FGOutputSwitchFault=auto

; -------------------------------------------------------
; FSR frame generation (FGOutput=ffx, the provider the game's own FidelityFX runtime supplies). Not used by DLSS-G or XeFG output.
;
; FSR's frame interpolation API requires the frame ID it is given to rise by exactly 1 per frame, and it resets its
; interpolation history on any other difference. The fork's dispatch selector is shared with the other providers and
; resyncs onto the game's own frame counter, so the ID it passes can jump forward when a frame went out without a
; dispatch (a hitch, a menu, loading) or fall back after a quality change: each of those costs one FSR history reset,
; which shows up as a single-frame flicker.
;
; true = FSR is given its own frame ID that rises by exactly 1 per dispatch, and the provider's present/dispatch
; callbacks are handed back the buffer slot of the dispatch their ID belongs to. false = the game's own frame ID, which
; is today's behaviour. Only the FSR output path differs; DLSS-G and XeFG are untouched either way.
; No menu control: it changes a provider-internal counter and nothing a player would compare in the menu.
; true or false - Default (auto) is false
FsrMonotonicFrameId=auto
