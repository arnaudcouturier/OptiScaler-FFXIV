; -------------------------------------------------------
; FSR frame generation (FGOutput=ffx, the provider the game's own FidelityFX runtime supplies). Not used by DLSS-G or XeFG output.
;
; FSR's frame interpolation API requires the frame ID it is given to rise by exactly 1 per frame, and it resets its
; interpolation history on any other difference. The fork's dispatch selector is shared with the other providers and
; resyncs onto the game's own frame counter, so the ID it passes can jump forward when a frame went out without a
; dispatch (a hitch, a menu, loading) or fall back after a quality change: each of those costs one FSR history reset,
; which shows up as a single-frame flicker.
;
; true = FSR is given its own frame ID that rises by exactly 1 per dispatch, and the provider's present/dispatch
; callbacks are handed back the buffer slot of the dispatch their ID belongs to. false = the game's own frame ID, which
; is today's behaviour. Only the FSR output path differs; DLSS-G and XeFG are untouched either way.
; No menu control: it changes a provider-internal counter and nothing a player would compare in the menu.
; true or false - Default (auto) is false
FsrMonotonicFrameId=auto
