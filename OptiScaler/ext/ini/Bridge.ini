; The D3D11 -> D3D12 hand-over. Every frame the D3D11 side copies the frame into a shared texture and signals a fence; the
; D3D12 side waits for that signal before it runs the upscaler and Neural Rendering. The D3D11 context only hands its
; commands to the driver when the game flushes, so the wait can start before any of that work was submitted.
; With this on, the fork flushes the D3D11 context itself, right after the signal was accepted, so the work is submitted
; then. A test of the scheduling bubble: the cost is a driver flush and less batching, the gain is a shorter wait, and
; nobody has measured which side wins. Off gives exactly the old hand-over. One log line says it is on:
;   Bridge FlushAfterSignal on: the D3D11 context is flushed after each D3D11 -> D3D12 fence Signal (experiment, ...)
; No menu control: an experiment switch, set in the ini only.
; true or false - Default (auto) is false
FlushAfterSignal=auto
