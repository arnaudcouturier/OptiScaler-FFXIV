; -------------------------------------------------------
; HUD-less frame generation (DLSS-G): keep the HUD sharp in fast camera motion. FFXIV only for now.
;   off           = today's behaviour
;   recomposition = DLSS-G recomposes the UI itself from a hud-less and a UI image (it still interpolates the UI layer);
;                   applies after a game restart (DLSS-G reads it when the feature is created). FSR-FG and XeFG only get the
;                   hud-less / UI image tags in this mode (untested)
;   ui_free       = frame generation runs on the UI-free image and the UI is pasted back at the real frame rate
; Any other value counts as off. With frame generation off, an unusable capture or any doubt the frame is presented as before.
; off, recomposition or ui_free - Default (auto) is off
Mode=auto

; Advanced: largest per-channel difference (0..1) between the final and the UI-free frame that still counts as "same pixel"
; float 0.001 - 1.0 - Default (auto) is 0.008
MaskThreshold=auto

; Advanced: grow the detected UI area by this many pixels
; int 0 - 4 - Default (auto) is 1
MaskDilation=auto

; Advanced: also paste where the previous frame had UI and this one does not (clears the ghost of UI that just closed)
; true or false - Default (auto) is true
PasteCleanup=auto

; Advanced: paste the UI of one real frame behind (steadier world-anchored UI, slightly older)
; true or false - Default (auto) is false
SteadyTiming=auto

; Advanced: fall back to normal frame generation when more than this share (0..1) of the pixels is flagged as UI for
; 5 measurements in a row (full-screen fades, a ReShade preset that runs before the capture). 0 = off
; While fallen back the UI-free image keeps being captured and measured (nothing from it is shown), so the guard can tell
; when to return: after 30 measurements in a row at or below 0.75 x this value (0.45 for the default). A measurement in
; between (0.45 to 0.60) keeps the fallback, so a cutscene that sits there stays on normal frame generation after its
; first fade. If 120 presents that captured the UI-free image bring no new measurement the guard lets go too. There is
; no key for the 0.75.
; float 0 - 1 - Default (auto) is 0.60
CoverageGuard=auto

; Debug: tint the pasted UI area
; true or false - Default (auto) is false
ShowDetectedUi=auto

; Apply your ReShade presets in place at the UI boundary, so the UI-free image has them and the HUD stays unfiltered.
; auto = when ReShade registered a runtime and at least one technique is enabled; on = always try; off = never.
; auto, on or off - Default (auto) is auto
ReShadePresets=auto
