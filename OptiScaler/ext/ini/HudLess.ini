; -------------------------------------------------------
; HUD-less frame generation (DLSS-G): keep the HUD sharp in fast camera motion. FFXIV only for now.
;   off           = today's behaviour
;   recomposition = DLSS-G recomposes the UI itself from a hud-less and a UI image (it still interpolates the UI layer);
;                   switching to or from it recreates DLSS-G at once (frame generation restarts for a moment). FSR-FG and XeFG only get the
;                   hud-less / UI image tags in this mode (untested)
;   ui_free       = frame generation runs on the UI-free image and the UI is pasted back at the real frame rate. Experimental;
;                   a micro-stutter was seen in motion while the coverage guard was tripped, and the default probe interval of 8
;                   removed it in the one play session it was tried (2026-10-31, DLSS-G preset C; at 1 it came back).
;                   Recommended instead: recomposition with [DLSSG] RenderPreset = auto.
; Any other value counts as off. With frame generation off, an unusable capture or any doubt the frame is presented as before.
; ui_free stays experimental; recomposition with [DLSSG] RenderPreset = auto is the safe choice.
; off, recomposition or ui_free - Default (auto) is off
Mode=auto

; Advanced: largest per-channel difference (0..1) between the final and the UI-free frame that still counts as "same pixel"
; float 0.001 - 1.0 - Default (auto) is 0.008
MaskThreshold=auto

; Advanced: grow the detected UI area by this many pixels
; int 0 - 4 - Default (auto) is 1
MaskDilation=auto

; Advanced: also paste where the previous frame had UI and this one does not (clears the ghost of UI that just closed)
; true or false - Default (auto) is true
PasteCleanup=auto

; Advanced: paste the UI of one real frame behind (steadier world-anchored UI, slightly older)
; true or false - Default (auto) is false
SteadyTiming=auto

; Advanced: fall back to normal frame generation when more than this share (0..1) of the pixels is flagged as UI for
; 5 measurements in a row (full-screen fades, a ReShade preset that runs before the capture). 0 = off
; While fallen back the UI-free image keeps being captured and measured (nothing from it is shown), so the guard can tell
; when to return: after 30 measurements in a row at or below 0.75 x this value (0.45 for the default). A measurement in
; between (0.45 to 0.60) keeps the fallback, so a cutscene that sits there stays on normal frame generation after its
; first fade. If 120 presents that captured the UI-free image bring no new measurement the guard lets go too. There is
; no key for the 0.75.
; A limit whose release level (0.75 x it) sits below the HUD's own flagged area trips on the HUD alone and keeps UI-free
; off for the whole session: the HUD-less menu warns (next to the slider) and OptiScaler.log gets one line per settled change,
; and the value you set is never changed for you. The warning names the smallest limit that releases again, the HUD-less status
; shows the limit in force, its release level ("over the guard limit 5%, falling back; release below 3.8%") and the HUD's own
; flagged area (the low fifth of the last 512 readbacks, so it follows a mask change), and a MaskThreshold or MaskDilation
; change starts that window over.
; float 0 - 1 - Default (auto) is 0.60
CoverageGuard=auto

; Debug: tint the pasted UI area. While the coverage guard is tripped nothing is swapped, so the tint draws the newest
; completed real frame's flagged pixels over the output: this is how the mask can be seen in exactly the state a diagnostic
; run is about. The draw replaces, it does not blend, so in the flagged region the output comes from that real frame and not
; from a generated one: the region runs at the real frame rate, with the judder the fallback already has (in a bad state the
; flagged share is most of the screen), over a normal base that carries its own UI. Off = no tint and the output is
; unchanged.
; true or false - Default (auto) is false
ShowDetectedUi=auto

; Developer switch, ini only. No menu control: how the coverage guard (CoverageGuard) trips and releases. legacy = as described above.
; density = trips when 3 of the last 12 measurements are over the limit, returns only after 60 measurements in a row at or below
; 0.75 x the limit, and a frame the game anchored after off-screen UI draws (a window drawn into another render target first) keeps the
; fallback at once. What is shown while it is in the fallback is what Mode = off shows (the capture and the paste image are still built
; every present, or one present in ProbeInterval). It switches between the two image paths far less often when such frames come in bursts, and when they alternate with
; good ones (where legacy never trips) it stops swapping the bad ones after its first trip. Design limit: while it is tripped every such
; frame restarts the clean run, so one such frame in every 60 presents (60 x ProbeInterval) or fewer keeps it in the fallback for as long as they come, even
; if their images measure clean. The 120-present safety release is unchanged. Unit-tested, not tried in a game. Any other value counts
; as legacy.
; legacy or density - Default (auto) is legacy
GuardMode=auto

; Developer switch, ini only. No menu control: a time limit for the density guard. 0 = off (today's behaviour). With N above 0 the guard
; leaves the fallback after N anchor-later frames in a row whose window had at least one measurement and none over the release level (a window without a measurement counts neither way), even though their arrival
; keeps the 60-measurement clean run from completing. Without it a frame anchored after off-screen UI draws in every 60 presents or fewer keeps
; the fallback for as long as they come, also when those images measure clean. The guard trips again by the normal rule. Density only.
; Unit-tested, not tried in a game.
; int 0 - 600 - Default (auto) is 0
GuardReleaseHolds=auto

; Developer switch, ini only. No menu control: with GuardMode = density, a frame the game anchored after off-screen UI draws trips the guard
; at once, so the base of that very frame is not swapped, instead of waiting about two presents for its measurement to arrive. The trip then
; ends by the normal release rules. Density only. Unit-tested, not tried in a game.
; true or false - Default (auto) is false
GuardTripOnAnchorLater=auto

; Advanced, experimental: while the coverage guard is tripped (falling back), build the UI-free capture and its mask on only one present
; in this many.
; The others copy nothing and build nothing: they are plain frame generation. The boundary still applies the ReShade presets in the same
; place on every frame and still reports what it sees, so nothing else changes. The guard then comes back after about 30 x this many
; presents of a clean scene instead of 30 (density: 60 x), and its 120-present safety release counts only the presents that measure.
; 1 = every present (the behaviour before this key). Default 8: in one play session on 2026-10-31 with DLSS-G render preset C, 8 removed
; the micro-stutter seen while falling back and 1 brought it back. Building them on every present is the suspected cause of that stutter
; (felt in play, not measured); only that session and preset were compared. Unit-tested.
; int 1 - 16 - Default (auto) is 8
ProbeInterval=auto

; Developer switch, ini only. No menu control: a blind A/B of ProbeInterval. With N above 0 the engine alternates between measuring on every
; present and measuring on one present in ProbeInterval, in blocks of N seconds; each pair of blocks holds one of each, in an order drawn
; at start, and OptiScaler.log gets one line per block ("HudLess: probe A/B block 3 (60 s blocks): probe interval 8"). The menu shows
; nothing of it, so a player can press the recorder's mark key whenever they feel a stutter without knowing the order, and the marks are
; counted per block afterwards. 0 = off; it also does nothing while ProbeInterval is 1.
; int 0 - 600 - Default (auto) is 0
ProbeAbSeconds=auto

; Advanced, experimental: where the UI-free image is taken on a frame whose first interface draw after the scene goes to an off-screen
; target (a small interface target drawn before the HUD in every frame in the world, probably the minimap). In a city such frames made
; the detected UI area cover 77 to 90 % of the picture.
;   r1b   = at the first interface draw into the backbuffer (the behaviour before this key)
;   early = at that off-screen draw: the backbuffer is copied there, right after the scene and before the off-screen block and the draws
;           that follow it
; Frames whose first interface draw goes to the backbuffer do not change. A frame with ReShade presets to apply at the UI boundary keeps
; r1b, so the presets stay where they always run. Both HUD-less modes use this image; the coverage guard runs only in ui_free, so in
; recomposition a wrong early image goes to DLSS-G unchecked (only its size and format are checked). Unit-tested, not tried in a game.
; Any other value counts as r1b.
; r1b or early - Default (auto) is r1b
AnchorRule=auto

; Developer switch, ini only. No menu control: with HDR output and Mode = ui_free, make the paste's HDR stage before the first paste image.
; Without it that image is never built (inferred from reading the code, never observed in a game): ui_free stays on normal frame
; generation under HDR output and nothing else changes. A failed creation of the stage is not tried again on every present: it waits
; until the HDR output state or this setting changes, and says so once. The path it switches on (the PQ conversion of the final frame
; for the paste) is unit-tested but has not been tried in a game: HDR display users are asked to confirm it before it becomes the default.
; off or on - Default (auto) is off
HdrPaste=auto

; Apply your ReShade presets in place at the UI boundary, so the UI-free image has them and the HUD stays unfiltered.
; auto = when ReShade registered a runtime and at least one technique is enabled; on = always try; off = never.
; auto, on or off - Default (auto) is auto
ReShadePresets=auto

; Developer gate, ini only. No menu control: switches on the game-side UI boundary detector's observation (draw tracking and the
; shader registry) even with Mode = off, shows the "HUD-less diagnostics" card of the FFXIV tab and also turns on the ReShade
; add-on probe. Observation only, it does not change the frame. Set it before the game starts.
; true or false - Default (auto) is false
Diagnostics=auto

; Developer gate, ini only. No menu control: the ReShade add-on also subscribes to the effect-runtime events, writes
; reshade-probe.txt into OptiScaler\hudless-diag\reshade-<time>\ and shows the "ReShade built-in add-on (diagnostics)" card. Without it OptiScaler
; only registers itself with ReShade (one attempt, one log line). Set it before the game starts.
; true or false - Default (auto) is false
ReShadeProbe=auto

; Developer switch, ini only. No menu control: turns on two log-only probes that measure what frame generation delivers and which UI draws
; could be nameplates. Output goes to OptiScaler\plate-probe\<run>\ (the five newest runs are kept): outputs.csv (one row per output
; present: time, thread, the real frame it belongs to, the expected multiplier), draws.csv and shaders-plate.csv (UI draws with their depth,
; blend, target and texture state), and a "Plate
; probe:" summary line in the log every 10 seconds. Nothing in the frame changes; the draw probe makes the UI boundary detector observe every
; draw (a few milliseconds per frame, a few more on the logged frames). Developer use only. Set it before the game starts. Unit-tested, not
; tried in a game.
; true or false - Default (auto) is false
PlateDiagnostics=auto

; Native nameplates: the game draws its nameplates once per game frame, so frame generation repeats that step on every
; output and the plates judder while the world moves smoothly. This takes the game's own plate draws into a plate-only
; image on the GPU and draws that image back over every output frame.
;   off      = today's behaviour, nothing is taken out of the frame
;   endpoint = the plate draws are taken out of the game's frame and drawn back over every output unchanged: the whole
;              path is exercised, and the picture is the same as with the key off
;   on       = accepted for the next stage. This build has no plate tracker, so On draws exactly what Endpoint draws and
;              moves nothing; the two advanced keys below have no effect yet.
; DLSS-G with a multiplier of 2 or more and an SDR output only. Any doubt keeps the plates native: a wrong blend, depth,
; target or shader state, a size the image cannot hold, or a frame the output pass cannot draw are never hidden. The plate
; image costs one screen-sized texture per slot at the output size (three at most, about 100 MB at 4K).
; off, endpoint or on - Default (auto) is off
PlateInterp=auto

; Advanced, for the plate tracker stage: which output of a batch shows the older plate position, as the constant c of the
; per-output share (k + c) / multiplier. auto assumes the generated frames come first and the real frame last. No effect
; in this build (no plate tracker yet).
; auto, 0 or 1 - Default (auto) is auto (1)
PlatePhaseOffset=auto

; Advanced, for the plate tracker stage: the largest distance a nameplate may be moved between two outputs, in output
; pixels. A plate that moves further than this in one game frame is drawn unshifted for that frame instead of jumping.
; No effect in this build (no plate tracker yet).
; int 0 - 256 - Default (auto) is 24
PlateMaxStep=auto
