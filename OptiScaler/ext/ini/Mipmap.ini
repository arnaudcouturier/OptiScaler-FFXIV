; Follow the upscaling ratio with the mipmap bias, so there is no number to work out by hand.
;
; The sharpening is set from the upscaling ratio of every evaluate of the DX11 upscaler: log2(render width / output width),
; 0 at native resolution (DLAA). In FFXIV it is applied when the game binds a sampler, so a change of the quality preset
; reaches every texture at once, also the samplers the game made earlier. Whether the value is added to the game's own bias
; or replaces it is decided from the game's own sampler biases at the first quality change (see OptiScaler.log: it says
; which). In other games, or if the sampler hooks cannot be attached, the older mode is used: the value is written into
; MipmapBiasOverride above and reaches the samplers created after a change, added to the game's own bias by default.
;
; A MipmapBiasOverride you set above always wins, nothing is applied automatically then.
; true or false - Default (auto) is true for FFXIV and false for other games
MipmapBiasAuto=auto

; Another name for MipmapBiasAuto (used by another build). MipmapBiasAuto wins when both are set. No menu control: the
; Automatic Mipmap Bias card in the Textures tab shows MipmapBiasAuto.
; true or false - Default (auto) is true for FFXIV and false for other games
AutomaticFFXIV=auto

; Added to the automatic value. Negative makes textures sharper, positive softer.
; -3.0 - 3.0 - Default (auto) is 0
MipmapBiasAutoOffset=auto

; Debug: log every distinct original sampler bias the game uses at each upscaling ratio (one line per new value).
; No menu control.
; true or false - Default (auto) is false
MipmapBiasObserve=auto
