; Follow the upscaling ratio with the mipmap bias, so there is no number to work out by hand.
;
; While this is on, the texture sharpening is set from the upscaling ratio of the newest upscaler
; the game created: log2(render width / display width), the number the "Mipmap Bias" calculator in
; the menu gives. It replaces MipmapBiasOverride above while it is on (that value is kept for when
; this is off) and is applied the same way, so the fixed, scale and all-textures options above
; still decide how and to which textures. By default the value is added to the game's own bias.
;
; Like the manual value it only reaches textures created after a change of the quality preset or
; the resolution. Nothing to do when the game's render and display sizes are the same.
; true or false - Default (auto) is false
MipmapBiasAuto=auto

; Added to the automatic value. Negative makes textures sharper, positive softer.
; -3.0 - 3.0 - Default (auto) is 0
MipmapBiasAutoOffset=auto
